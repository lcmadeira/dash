name: Published dashboard smoke check

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-smoke:
    name: Verify GitHub Pages publication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check page and critical assets
        run: node scripts/check-published-site.mjs
